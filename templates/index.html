<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Buddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #e8f1ec;
      --ink: #14302b;
      --card: #ffffff;
      --accent: #f2b705;
      --muted: #5d7a72;
      --line: #cfe0d8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1f1b;
        --ink: #e6f2ed;
        --card: #16302a;
        --accent: #f2b705;
        --muted: #93b3a9;
        --line: #264a41;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 640px;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }
    header { padding: 8px 4px 14px; }
    h1 { margin: 0; font-size: 1.7rem; font-weight: 800; letter-spacing: -0.5px; }
    header p { margin: 4px 0 0; color: var(--muted); }
    #log {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px 4px;
    }
    .msg {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 16px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .bot { background: var(--card); border: 1px solid var(--line); align-self: flex-start; border-bottom-left-radius: 4px; }
    .user { background: var(--ink); color: var(--bg); align-self: flex-end; border-bottom-right-radius: 4px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 0; }
    .chip {
      font: inherit; font-size: 0.9rem;
      background: transparent; color: var(--ink);
      border: 1.5px solid var(--ink); border-radius: 999px;
      padding: 6px 12px; cursor: pointer;
    }
    .chip:hover { background: var(--accent); border-color: var(--accent); color: #14302b; }
    .row { display: flex; gap: 8px; padding-top: 6px; }
    input {
      flex: 1; font: inherit; padding: 12px 14px;
      border-radius: 12px; border: 1.5px solid var(--line);
      background: var(--card); color: var(--ink);
    }
    input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    #send {
      font: inherit; font-weight: 800; padding: 0 20px;
      border: 0; border-radius: 12px; cursor: pointer;
      background: var(--accent); color: #14302b;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Daily Buddy</h1>
      <p>Ask me simple everyday things.</p>
    </header>

    <div id="log" aria-live="polite"></div>

    <div class="chips">
      <button class="chip">What time is it?</button>
      <button class="chip">Tell me a joke</button>
      <button class="chip">How to make tea?</button>
      <button class="chip">25 * 4</button>
      <button class="chip">Help</button>
    </div>

    <div class="row">
      <input id="box" type="text" placeholder="Type your question..." autocomplete="off" maxlength="300">
      <button id="send">Send</button>
    </div>
  </div>

  <script>
    const log = document.getElementById("log");
    const box = document.getElementById("box");

    function add(text, who) {
      const d = document.createElement("div");
      d.className = "msg " + who;
      d.textContent = text;
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
    }

    async function send(text) {
      text = text.trim();
      if (!text) return;
      add(text, "user");
      box.value = "";
      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        add(data.reply, "bot");
      } catch (e) {
        add("I can't reach the server right now. Please try again.", "bot");
      }
    }

    document.getElementById("send").onclick = () => send(box.value);
    box.addEventListener("keydown", e => { if (e.key === "Enter") send(box.value); });
    document.querySelectorAll(".chip").forEach(c => c.onclick = () => send(c.textContent));

    add("Vanakkam! I'm Daily Buddy. Tap a button below or type a question.", "bot");
  </script>
</body>
</html>
